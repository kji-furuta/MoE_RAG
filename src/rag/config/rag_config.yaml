document_processing:
  chunking:
    chunk_size: 512
    min_chunk_size: 100
    overlap: 128
    semantic:
      model: gpt-neox-20b-lora-20250906_104924:latest
      threshold: 0.7
    strategy: semantic
  ocr:
    gpu: true
    languages:
    - ja
    - en
  pdf_parser:
    dpi: 300
    extract_images: true
    extract_tables: true
embedding:
  batch_size: 32
  device: cuda
  embedding_dim: 1024
  max_length: 512
  # Available models (1024-dim compatible with existing vector DB):
  # - "intfloat/multilingual-e5-large" (1024-dim, multilingual)
  # - "intfloat/multilingual-e5-large-instruct" (1024-dim, RAG-optimized, RECOMMENDED)
  # - "cl-nagoya/sup-simcse-ja-large" (1024-dim, Japanese-specialized)
  model_name: intfloat/multilingual-e5-large-instruct
  normalize_embeddings: true
evaluation:
  metrics:
  - accuracy
  - citation_accuracy
  - response_time
  - relevance_score
  test_dataset_path: ./data/rag_documents/test_queries.json
