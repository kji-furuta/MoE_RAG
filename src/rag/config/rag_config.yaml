    batch_size: 50
    enabled: true
  cache:
    enabled: true
    max_size: 1000
    ttl: 3600
  parallel_processing:
    max_workers: 4
retrieval:
  hybrid_search:
    enabled: true
    keyword_weight: 0.3
    vector_weight: 0.7
  keyword_engine:
    backend: bm25
    max_features: 30000
    min_df: 2
    ngram_max: 4
    ngram_min: 2
    rebuild_threshold: 200
  metadata_filters:
  - document_type
  - version
  - chapter
  - section
  rerank_top_k: 5
  reranking:
    enabled: true
    model: gpt-neox-20b-lora-20250906_104924:latest
  top_k: 10
security:
  auth:
    enabled: false
  document_access:
    check_permissions: false
  logging:
    anonymize_pii: false
    log_queries: true
    log_responses: true
specialized:
  citation:
    include_page_numbers: true
    include_section_numbers: true
    max_citation_length: 256
  numerical_processing:
    extract_units: true
    normalize_units: true
    unit_mapping:
      キロメートル: km
      パーセント: '%'
      メートル: m
  version_control:
    enabled: true
    track_changes: true
system:
  gpu_memory_fraction: 0.95
  language: ja
  log_level: INFO
  memory_optimization: true
  name: 土木道路設計特化型RAGシステム
  use_dual_gpu: true
  version: 1.0.0
ui:
  features:
    batch_query: true
    export_results: true
    file_upload: true
    version_selection: true
  streamlit:
    max_upload_size: 200
    port: 8051
    theme: dark
vector_store:
  qdrant:
    collection_name: road_design_docs
    prefer_grpc: false
    timeout: 60
    url: http://qdrant:6333
    vector_dim: 1024
  type: qdrant
