{% extends "base.html" %}

{% block title %}操作マニュアル - AI Fine-tuning Toolkit{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3>操作マニュアル（README）</h3>
                    <p class="text-muted mb-0">最新の更新内容とシステム操作方法</p>
                </div>
                <div class="card-body">
                    <!-- README.mdの内容を動的に表示 -->
                    <div class="readme-content">
                        {{ readme_content|safe }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_styles %}
<style>
/* README用のスタイル */
.readme-content {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
}

.readme-content h1 {
    font-size: 2em;
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 600;
    line-height: 1.25;
    border-bottom: 1px solid #e1e4e8;
    padding-bottom: 0.3em;
}

.readme-content h2 {
    font-size: 1.5em;
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 600;
    line-height: 1.25;
    border-bottom: 1px solid #e1e4e8;
    padding-bottom: 0.3em;
}

.readme-content h3 {
    font-size: 1.25em;
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 600;
    line-height: 1.25;
}

.readme-content h4 {
    font-size: 1em;
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 600;
}

.readme-content pre {
    background-color: #f6f8fa;
    border: 1px solid #e1e4e8;
    border-radius: 6px;
    padding: 16px;
    overflow: auto;
    font-size: 85%;
    line-height: 1.45;
    margin-top: 0;
    margin-bottom: 16px;
}

.readme-content code {
    background-color: rgba(27,31,35,.05);
    border-radius: 3px;
    font-size: 85%;
    margin: 0;
    padding: .2em .4em;
    font-family: SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
}

.readme-content pre code {
    background: transparent;
    border: 0;
    display: inline;
    padding: 0;
    font-size: 100%;
}

.readme-content ul, .readme-content ol {
    margin-top: 0;
    margin-bottom: 16px;
    padding-left: 2em;
}

.readme-content li {
    margin-bottom: 4px;
}

.readme-content table {
    display: block;
    width: 100%;
    overflow: auto;
    margin-bottom: 16px;
}

.readme-content table th,
.readme-content table td {
    padding: 6px 13px;
    border: 1px solid #dfe2e5;
}

.readme-content table tr {
    background-color: #fff;
    border-top: 1px solid #c6cbd1;
}

.readme-content table tr:nth-child(2n) {
    background-color: #f6f8fa;
}

.readme-content blockquote {
    margin: 0 0 16px 0;
    padding: 0 1em;
    color: #6a737d;
    border-left: .25em solid #dfe2e5;
}

.readme-content strong {
    font-weight: 600;
}

.readme-content em {
    font-style: italic;
}

.readme-content a {
    color: #0366d6;
    text-decoration: none;
}

.readme-content a:hover {
    text-decoration: underline;
}

/* コードブロック用の追加スタイル */
.codehilite {
    background: #f6f8fa;
    border-radius: 6px;
    padding: 16px;
    overflow: auto;
    margin-bottom: 16px;
}

/* 絵文字のサイズ調整 */
.readme-content img[alt*="✅"],
.readme-content img[alt*="🎯"],
.readme-content img[alt*="🚀"],
.readme-content img[alt*="⚡"],
.readme-content img[alt*="🧑‍💻"],
.readme-content img[alt*="📦"],
.readme-content img[alt*="🔧"],
.readme-content img[alt*="📝"],
.readme-content img[alt*="⚠️"] {
    width: 1.2em;
    height: 1.2em;
    vertical-align: text-bottom;
}
</style>
{% endblock %}
